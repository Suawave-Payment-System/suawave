version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - gosec
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
  settings:
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^float(32|64)$
          msg: floating point is forbidden on the money path
        - pattern: ^math\.(Float64frombits|Float32frombits)$
          msg: floating point is forbidden on the money path
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104
  exclusions:
    generated: strict
    rules:
      - path: client\.go$
        linters:
          - gosec
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - suawave
